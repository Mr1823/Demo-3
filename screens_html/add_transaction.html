<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Modern Editorial - Add Transaction</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00E57A",
                        "background": "#FFFFFF",
                        "surface": "#F7F7F7",
                        "text": "#0A0A0A",
                        "muted": "#828282",
                        "danger": "#FF3366"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "heading": ["Fraunces", "serif"],
                        "body": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "2px",
                        "lg": "4px",
                        "xl": "8px",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Hide scrollbar for category selector */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-text antialiased min-h-screen w-full relative overflow-hidden">
<!-- Mock Dashboard Background (Darkened) -->
<div class="absolute inset-0 bg-text/40 z-0"></div>
<!-- Bottom Sheet Modal -->
<div class="absolute bottom-0 left-0 w-full bg-background border-t border-text z-10 flex flex-col h-[663px]">
<!-- Handle -->
<div class="w-full flex justify-center py-4 pb-2">
<div class="w-12 h-1 bg-text/20 rounded-full"></div>
</div>
<!-- Amount Display -->
<div class="flex-none pt-4 pb-6 px-6 text-center border-b border-text/10">
<h1 class="font-heading font-semibold text-[56px] leading-none text-text tracking-tight">2,450.00</h1>
<p class="text-muted text-sm mt-2 uppercase tracking-widest font-semibold">Current Entry</p>
</div>
<!-- Category Selector -->
<div class="flex-none py-4 border-b border-text/10 overflow-x-auto no-scrollbar px-6 flex space-x-3 items-center">
<button class="flex-none px-4 py-2 border border-text bg-text text-background font-semibold text-sm rounded transition-colors uppercase tracking-wide">
                Food
            </button>
<button class="flex-none px-4 py-2 border border-text bg-background text-text font-semibold text-sm rounded hover:bg-surface transition-colors uppercase tracking-wide">
                Transit
            </button>
<button class="flex-none px-4 py-2 border border-text bg-background text-text font-semibold text-sm rounded hover:bg-surface transition-colors uppercase tracking-wide">
                Coffee
            </button>
<button class="flex-none px-4 py-2 border border-text bg-background text-text font-semibold text-sm rounded hover:bg-surface transition-colors uppercase tracking-wide">
                Bills
            </button>
<button class="flex-none px-4 py-2 border border-text bg-background text-text font-semibold text-sm rounded hover:bg-surface transition-colors uppercase tracking-wide">
                Groceries
            </button>
</div>
<!-- Custom Numpad -->
<div class="flex-grow grid grid-cols-3 grid-rows-4 bg-background">
<button class="flex items-center justify-center text-2xl font-semibold border-r border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">1</button>
<button class="flex items-center justify-center text-2xl font-semibold border-r border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">2</button>
<button class="flex items-center justify-center text-2xl font-semibold border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">3</button>
<button class="flex items-center justify-center text-2xl font-semibold border-r border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">4</button>
<button class="flex items-center justify-center text-2xl font-semibold border-r border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">5</button>
<button class="flex items-center justify-center text-2xl font-semibold border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">6</button>
<button class="flex items-center justify-center text-2xl font-semibold border-r border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">7</button>
<button class="flex items-center justify-center text-2xl font-semibold border-r border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">8</button>
<button class="flex items-center justify-center text-2xl font-semibold border-b border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">9</button>
<button class="flex items-center justify-center text-2xl font-semibold border-r border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">.</button>
<button class="flex items-center justify-center text-2xl font-semibold border-r border-text/10 hover:bg-surface active:bg-text active:text-background transition-colors duration-75">0</button>
<button class="flex items-center justify-center text-2xl font-semibold text-danger border-text/10 hover:bg-surface active:bg-danger active:text-background transition-colors duration-75">
<span class="material-symbols-outlined text-[28px]">backspace</span>
</button>
</div>
<!-- Commit Button -->
<div class="flex-none p-4 pb-8 bg-background border-t border-text/10">
<button class="w-full bg-text text-background font-semibold text-sm py-4 uppercase tracking-widest hover:bg-text/90 transition-colors">
                Commit Expense
            </button>
</div>
</div>
</body></html>
