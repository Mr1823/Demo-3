</div>
<script>
        // Subtle interaction script for input states
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('opacity-100');
            });
            input.addEventListener('blur', () => {
                if(!input.value) {
                    input.parentElement.parentElement.classList.remove('opacity-100');
                }
            });
        });

        // Micro-interaction for the sign-in button
        const loginBtn = document.querySelector('button[type="submit"]');
        if (loginBtn) {
            loginBtn.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'absolute inset-0 bg-white/10 pointer-events-none animate-ping';
                loginBtn.style.position = 'relative';
                loginBtn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        }
    </script>
