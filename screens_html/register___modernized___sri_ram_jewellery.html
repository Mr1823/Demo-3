<script>
        // Micro-interaction for inputs
        document.querySelectorAll('.input-underline').forEach(input => {
            input.addEventListener('focus', () => {
                const label = input.previousElementSibling;
                label.classList.add('text-primary');
                label.classList.remove('text-on-surface-variant/80');
            });
            input.addEventListener('blur', () => {
                const label = input.previousElementSibling;
                label.classList.remove('text-primary');
                label.classList.add('text-on-surface-variant/80');
            });
        });

        // Atmospheric parallax on mouse move (Subtle)
        document.addEventListener('mousemove', (e) => {
            const amount = 3; // Reduced for even more subtlety
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            document.body.style.backgroundPosition = `${50 + x}% ${50 + y}%`;
        });
    </script>
